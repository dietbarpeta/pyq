<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Profile</title>

<meta
name="theme-color"
content="#020617"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>


<style>

/* =========================
   RESET
========================= */

*{
box-sizing:border-box;
margin:0;
padding:0;
}


/* =========================
   BODY
========================= */

body{

font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:
linear-gradient(
145deg,
#0f172a,
#020617
);

color:#fff;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

}


/* =========================
   PROFILE
========================= */

.profile{

width:100%;

max-width:430px;

background:
rgba(15,23,42,.96);

border:1px solid #334155;

border-radius:24px;

overflow:hidden;

box-shadow:
0 25px 60px rgba(0,0,0,.55);

}


/* =========================
   COVER
========================= */

.cover{

height:130px;

position:relative;

background:

radial-gradient(
circle at 20% 30%,
rgba(59,130,246,.45),
transparent 35%
),

radial-gradient(
circle at 80% 70%,
rgba(168,85,247,.35),
transparent 35%
),

linear-gradient(
135deg,
#1e3a8a,
#312e81,
#0f172a
);

}


/* Decorative circles */

.cover::before{

content:"";

position:absolute;

width:150px;
height:150px;

border-radius:50%;

border:1px solid rgba(255,255,255,.12);

top:-70px;
right:-40px;

}

.cover::after{

content:"";

position:absolute;

width:100px;
height:100px;

border-radius:50%;

border:1px solid rgba(255,255,255,.08);

bottom:-60px;
left:-30px;

}


/* =========================
   PROFILE IMAGE
========================= */

.avatar{

position:absolute;

left:50%;

bottom:-48px;

transform:translateX(-50%);

width:96px;

height:96px;

border-radius:50%;

background:#020617;

border:5px solid #020617;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

box-shadow:
0 8px 25px rgba(0,0,0,.5);

}


/*
   আপনার ছবি ব্যবহার করতে চাইলে
   নিচের img uncomment করুন
*/

.avatar img{

width:100%;

height:100%;

object-fit:cover;

}


/* যদি ছবি না থাকে */

.avatar i{

font-size:42px;

color:#64748b;

}


/* =========================
   CONTENT
========================= */

.content{

padding:65px 24px 25px;

text-align:center;

}


/* =========================
   NAME
========================= */

.name{

font-size:24px;

font-weight:700;

letter-spacing:.2px;

margin-bottom:5px;

}


/* =========================
   ROLE
========================= */

.role{

font-size:14px;

color:#94a3b8;

margin-bottom:16px;

}


/* =========================
   VERIFIED
========================= */

.verified{

display:inline-flex;

align-items:center;

gap:5px;

font-size:12px;

padding:5px 10px;

border-radius:20px;

background:#3b82f620;

border:1px solid #3b82f655;

color:#60a5fa;

margin-bottom:18px;

}


/* =========================
   BIO
========================= */

.bio{

font-size:13px;

line-height:1.7;

color:#cbd5e1;

margin-bottom:22px;

}


/* =========================
   STATS
========================= */

.stats{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:10px;

margin-bottom:22px;

}

.stat{

background:#1e293b;

border:1px solid #334155;

border-radius:14px;

padding:12px 5px;

}

.stat strong{

display:block;

font-size:17px;

color:#fff;

margin-bottom:3px;

}

.stat span{

font-size:11px;

color:#94a3b8;

}


/* =========================
   SOCIAL
========================= */

.social{

display:flex;

justify-content:center;

gap:10px;

margin-bottom:22px;

}

.social a{

width:42px;

height:42px;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

background:#1e293b;

border:1px solid #334155;

color:#cbd5e1;

text-decoration:none;

font-size:17px;

transition:.25s;

}

.social a:hover{

transform:
translateY(-4px);

background:#334155;

color:#fff;

}


/* =========================
   WEBSITE BUTTON
========================= */

.website{

display:flex;

align-items:center;

justify-content:center;

gap:8px;

width:100%;

padding:11px;

border-radius:12px;

background:#3b82f6;

color:white;

text-decoration:none;

font-size:14px;

font-weight:600;

transition:.25s;

}

.website:hover{

background:#2563eb;

transform:translateY(-2px);

}


/* =========================
   FOOTER
========================= */

.profile-footer{

margin-top:20px;

padding-top:18px;

border-top:1px solid #1e293b;

font-size:11px;

color:#64748b;

}

.profile-footer b{

color:#94a3b8;

}


/* =========================
   MOBILE
========================= */

@media(max-width:400px){

body{

padding:10px;

}

.profile{

border-radius:20px;

}

.content{

padding-left:18px;

padding-right:18px;

}

.name{

font-size:22px;

}

.stats{

gap:6px;

}

}


/* =========================
   ANIMATION
========================= */

.profile{

animation:
profileIn .45s ease;

}

@keyframes profileIn{

from{

opacity:0;

transform:
translateY(20px)
scale(.97);

}

to{

opacity:1;

transform:
translateY(0)
scale(1);

}

}

</style>

</head>


<body>


<div class="profile">


<!-- =====================
     COVER
===================== -->

<div class="cover">


<!-- =====================
     PROFILE IMAGE
===================== -->

<div class="avatar">
<img src="profile.jpg" alt="Profile">
<!--

নিজের ছবি দিতে চাইলে:

<img src="profile.jpg" alt="Profile">



<i class="fa-solid fa-user"></i>
-->
</div>

</div>


<!-- =====================
     CONTENT
===================== -->

<div class="content">


<h1 class="name">
Shajidul Ahmed
</h1>


<div class="role">
Developer • Designer • Creator
</div>


<div class="verified">

<i class="fa-solid fa-circle-check"></i>

Official Profile

</div>


<p class="bio">

Welcome to my profile.
This platform is created to provide
useful educational resources and
previous year question papers in a
simple and accessible way.

</p>


<!-- =====================
     STATS
===================== -->

<div class="stats">


<div class="stat">

<strong>DELED</strong>

<span>Resources</span>

</div>


<div class="stat">

<strong>PDF</strong>

<span>Collection</span>

</div>


<div class="stat">

<strong>2026</strong>

<span>Updated</span>

</div>


</div>


<!-- =====================
     SOCIAL LINKS
===================== -->

<div class="social">


<a
href="https://fb.me/shajidulahmed"
aria-label="Facebook"
>

<i class="fa-brands fa-facebook-f"></i>

</a>


<a
href="#"
aria-label="Telegram"
>

<i class="fa-brands fa-telegram"></i>

</a>


<a
href="https://Instagram.com/shajidulahmed"
aria-label="Instagram"
>

<i class="fa-brands fa-instagram"></i>

</a>

<!-- =====================
<a
href="#"
aria-label="GitHub"
>
===================== -->
	<!-- =====================
<i class="fa-brands fa-github"></i>
===================== -->
<!-- =====================
</a>
===================== -->

</div>


<!-- =====================
     WEBSITE
===================== -->

<a
href="https://www.sidlibrary.in/?m=1"
class="website"
target="_blank"
>

<i class="fa-solid fa-globe"></i>

Visit Website

</a>


<!-- =====================
     FOOTER
===================== -->

<div class="profile-footer">

Powered by
<b>incognito</b>

</div>


</div>

</div>


</body>

</html>
